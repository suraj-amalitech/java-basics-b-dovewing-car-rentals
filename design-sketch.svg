<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="630" fill="#fafafa"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Dovewing Car Rentals — Rebuilt Structure</text>

  <!-- ===== Connectors (drawn first, under boxes) ===== -->
  <!-- VehicleCategory -> Vehicle -->
  <line x1="130" y1="120" x2="130" y2="190" stroke="#5a8a5a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- RenterKind -> Renter -->
  <line x1="825" y1="120" x2="825" y2="190" stroke="#5a8a5a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- RentalStatus -> Rental -->
  <line x1="825" y1="490" x2="825" y2="450" stroke="#5a8a5a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Depot -> Vehicle -->
  <line x1="400" y1="270" x2="330" y2="270" stroke="#6b2fa0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="365" y="262" text-anchor="middle" font-size="10" fill="#6b2fa0">uses</text>
  <!-- Depot -> Renter -->
  <line x1="650" y1="240" x2="720" y2="240" stroke="#6b2fa0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="685" y="232" text-anchor="middle" font-size="10" fill="#6b2fa0">uses</text>
  <!-- Depot -> Rental -->
  <polyline points="600,355 600,400 720,400" fill="none" stroke="#6b2fa0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="660" y="392" text-anchor="middle" font-size="10" fill="#6b2fa0">creates</text>

  <!-- Inheritance -->
  <polyline points="125,430 125,395 335,395" fill="none" stroke="#2f5f9f" stroke-width="2"/>
  <line x1="335" y1="430" x2="335" y2="395" stroke="#2f5f9f" stroke-width="2"/>
  <line x1="180" y1="395" x2="180" y2="373" stroke="#2f5f9f" stroke-width="2"/>
  <polygon points="180,355 170,373 190,373" fill="#fff" stroke="#2f5f9f" stroke-width="2"/>
  <!-- planned van (dashed) -->
  <polyline points="335,395 545,395 545,430" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ===== Enums ===== -->
  <g stroke="#5a8a5a" stroke-width="1.5" fill="#e8f3e8">
    <rect x="30" y="50" width="200" height="70" rx="6"/>
    <rect x="725" y="50" width="200" height="70" rx="6"/>
    <rect x="725" y="490" width="200" height="70" rx="6"/>
  </g>
  <g fill="#2d5a2d" text-anchor="middle">
    <text x="130" y="68" font-size="10">«enum»</text><text x="130" y="84" font-weight="bold">VehicleCategory</text><text x="130" y="102">ECONOMY · PREMIUM</text>
    <text x="825" y="68" font-size="10">«enum»</text><text x="825" y="84" font-weight="bold">RenterKind</text><text x="825" y="102">CASUAL · MEMBER</text>
    <text x="825" y="508" font-size="10">«enum»</text><text x="825" y="524" font-weight="bold">RentalStatus</text><text x="825" y="542">ACTIVE · RETURNED</text>
  </g>

  <!-- ===== Vehicle ===== -->
  <rect x="30" y="190" width="300" height="165" rx="6" fill="#dce8f8" stroke="#2f5f9f" stroke-width="1.5"/>
  <line x1="30" y1="232" x2="330" y2="232" stroke="#2f5f9f"/>
  <text x="180" y="206" text-anchor="middle" font-size="10" fill="#2f5f9f">«abstract»</text>
  <text x="180" y="224" text-anchor="middle" font-weight="bold" fill="#1d3f6f">Vehicle</text>
  <g fill="#222">
    <text x="40" y="254">- rented: boolean</text>
    <text x="40" y="272">- id, model, reg, dailyRate</text>
    <text x="40" y="294">+ isAvailable(): boolean</text>
    <text x="40" y="312">+ rent() / returnCar()</text>
    <text x="40" y="334" fill="#d00000">+ calculateDeposit(RenterKind)</text>
  </g>

  <!-- ===== Depot ===== -->
  <rect x="400" y="190" width="250" height="165" rx="6" fill="#efe3f8" stroke="#6b2fa0" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="650" y2="220" stroke="#6b2fa0"/>
  <text x="525" y="211" text-anchor="middle" font-weight="bold" fill="#4a1d70">Depot</text>
  <g fill="#222">
    <text x="410" y="240">- name: String</text>
    <text x="410" y="258">- vehicles: List&lt;Vehicle&gt;</text>
    <text x="410" y="276">- renters: List&lt;Renter&gt;</text>
    <text x="410" y="294">- rentals: List&lt;Rental&gt;</text>
    <text x="410" y="318" fill="#d00000">+ rent(): checks isAvailable</text>
    <text x="410" y="338">+ returnVehicle(), printReport()</text>
  </g>

  <!-- ===== Renter ===== -->
  <rect x="720" y="190" width="210" height="120" rx="6" fill="#fff3d9" stroke="#a87410" stroke-width="1.5"/>
  <line x1="720" y1="220" x2="930" y2="220" stroke="#a87410"/>
  <text x="825" y="211" text-anchor="middle" font-weight="bold" fill="#6b4700">Renter</text>
  <g fill="#222">
    <text x="730" y="240">- id, name</text>
    <text x="730" y="258">- kind: RenterKind</text>
    <text x="730" y="276">- history: List&lt;String&gt;</text>
    <text x="730" y="298">+ getName(), getKind()</text>
  </g>

  <!-- ===== Rental ===== -->
  <rect x="720" y="340" width="210" height="110" rx="6" fill="#fde6e6" stroke="#a02f2f" stroke-width="1.5"/>
  <line x1="720" y1="370" x2="930" y2="370" stroke="#a02f2f"/>
  <text x="825" y="361" text-anchor="middle" font-weight="bold" fill="#6f1d1d">Rental</text>
  <g fill="#222">
    <text x="730" y="390">- id, renterName</text>
    <text x="730" y="406">- vehicleReg, days</text>
    <text x="730" y="422">- cost, deposit</text>
    <text x="730" y="438">- status: RentalStatus</text>
    <text x="730" y="446" font-size="1"> </text>
  </g>

  <!-- ===== Subclasses ===== -->
  <rect x="30" y="430" width="190" height="85" rx="6" fill="#dce8f8" stroke="#2f5f9f" stroke-width="1.5"/>
  <line x1="30" y1="455" x2="220" y2="455" stroke="#2f5f9f"/>
  <text x="125" y="448" text-anchor="middle" font-weight="bold" fill="#1d3f6f">Economy</text>
  <text x="125" y="478" text-anchor="middle">calculateDeposit()</text>
  <text x="125" y="497" text-anchor="middle" font-size="11" fill="#555">MEMBER: waived</text>

  <rect x="240" y="430" width="190" height="85" rx="6" fill="#dce8f8" stroke="#2f5f9f" stroke-width="1.5"/>
  <line x1="240" y1="455" x2="430" y2="455" stroke="#2f5f9f"/>
  <text x="335" y="448" text-anchor="middle" font-weight="bold" fill="#1d3f6f">Premium</text>
  <text x="335" y="478" text-anchor="middle">calculateDeposit()</text>
  <text x="335" y="497" text-anchor="middle" font-size="11" fill="#555">MEMBER: waived</text>

  <rect x="450" y="430" width="190" height="85" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="450" y1="455" x2="640" y2="455" stroke="#999" stroke-dasharray="6,4"/>
  <text x="545" y="448" text-anchor="middle" font-weight="bold" fill="#888">CommercialVan</text>
  <text x="545" y="478" text-anchor="middle" fill="#888">calculateDeposit()</text>
  <text x="545" y="497" text-anchor="middle" font-size="11" fill="#888">own rules · next quarter</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="545" width="430" height="70" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="42" y="563" font-weight="bold" font-size="11">Legend</text>
  <line x1="42" y1="578" x2="82" y2="578" stroke="#2f5f9f" stroke-width="2"/>
  <text x="90" y="582" font-size="11">inheritance (solid)</text>
  <line x1="250" y1="578" x2="290" y2="578" stroke="#6b2fa0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="298" y="582" font-size="11">uses / creates (dashed)</text>
  <text x="42" y="603" font-size="11" fill="#d00000">red text = enforced invariant / key method</text>
</svg>
